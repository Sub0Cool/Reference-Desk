    <text x="753" y="111"><tspan x="753">HEALTH</tspan><tspan x="753" dy="21">&amp; SAFETY</tspan></text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#7794B1" font-size="15" text-anchor="middle" letter-spacing=".5" opacity=".64">
