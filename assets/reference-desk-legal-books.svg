<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" fill="none" role="img" aria-labelledby="title">
  <title id="title">Subtle line-art California legal reference books and an asymmetrically open volume</title>
  <!-- Barely-there, architectural book outlines. Deliberately no photographic or page-swoosh effects. -->
  <g stroke="#8FA8C3" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round" opacity=".48">
    <!-- Upright, varying-height California law volumes -->
    <path d="M390 27 Q390 18 400 18 H480 Q489 18 489 27 V242 H390 Z"/>
    <path d="M397 25 V237 M479 25 V237 M390 60 H489 M390 194 H489 M401 34 H478"/>
    <path d="M495 18 Q495 10 504 10 H586 Q594 10 594 18 V242 H495 Z"/>
    <path d="M503 19 V235 M586 19 V235 M495 57 H594 M495 194 H594 M507 30 H582"/>
    <path d="M601 32 Q601 24 609 24 H696 Q705 24 705 32 V242 H601 Z"/>
    <path d="M609 32 V235 M697 32 V235 M601 71 H705 M601 197 H705 M615 43 H691"/>
    <path d="M711 17 Q711 9 719 9 H785 Q794 9 794 17 V242 H711 Z"/>
    <path d="M719 17 V238 M786 17 V238 M711 58 H794 M711 196 H794"/>
    <!-- A horizontal stack of reference casebooks at the upper far right -->
    <path d="M800 56 Q800 47 809 47 H983 V101 H800 Z M807 54 H979 M808 93 H977"/>
    <path d="M783 110 Q783 103 791 103 H991 V155 H783 Z M792 111 H984 M793 147 H986"/>
    <path d="M809 164 Q809 158 817 158 H994 V203 H809 Z M817 165 H987 M817 194 H986"/>
    <!-- understated recessed spine bands -->
    <path d="M403 75 H477 M403 179 H477 M506 72 H581 M506 180 H581 M616 86 H691 M616 182 H691 M721 75 H782 M721 180 H782"/>
    <!-- Open law book, asymmetrical pages and a short, solid binding -->
    <path d="M722 253 Q658 217 568 218 Q522 218 484 229 L484 317 Q615 295 722 356"/>
    <path d="M722 253 Q781 204 845 213 Q922 215 985 231 L985 315 Q842 301 722 356"/>
    <path d="M722 255 V354 M485 316 Q609 310 722 365 Q838 309 985 315"/>
    <path d="M722 259 Q640 233 554 240 M722 273 Q626 249 519 258 M722 289 Q611 266 508 278 M722 305 Q609 287 515 296"/>
    <path d="M723 262 Q804 232 895 243 M723 279 Q812 248 942 259 M723 295 Q813 266 959 280 M723 312 Q829 284 969 299"/>
    <!-- page edges: simple book construction rather than flowing decorative ribbons -->
    <path d="M483 318 L472 325 Q606 319 722 375 Q857 320 998 324 L985 315"/>
    <path d="M722 365 V375 M478 324 Q484 334 494 334 M993 322 L993 329"/>
  </g>
