name: Moral Turpitude browser regression

on:
  pull_request:
    paths:
      - 'moral-turpitude.js'
      - 'data/moral-turpitude.js'
      - 'index.html'
      - 'script.js'
      - 'styles.css'
      - 'tests/moral-turpitude.spec.js'
      - '.github/workflows/moral-turpitude-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static website
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/reference-desk-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run Chromium browser regressions
        run: npx playwright test tests/moral-turpitude.spec.js
